spring.datasource.url=jdbc:h2:mem:heritage-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.upload-dir=build/test-uploads
security.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes

openai.enabled=false
openai.api-key=
openai.model=gpt-5.5
openai.connect-timeout-seconds=20
openai.read-timeout-seconds=300
openai.paper-understanding-timeout-seconds=300
openai.scene-brief-timeout-seconds=90
openai.max-input-chars=16000

ai-understanding.provider-priority=openai
ollama.enabled=false

grobid.enabled=false
grobid.url=http://localhost:8070
grobid.base-url=http://localhost:8070
grobid.fail-upload-if-unavailable=false

comfyui.enabled=false
comfyui.base-url=http://127.0.0.1:8188
comfyui.workflow=sdxl-basic-teaser-workflow.json
comfyui.checkpoint=sd_xl_base_1.0.safetensors
comfyui.output-directory=build/test-uploads/generated-covers
comfyui.default-width=1024
comfyui.default-height=768
comfyui.internal-candidates=1
comfyui.return-candidates=1
comfyui.timeout-seconds=5

ai-cover.candidate-ranking-enabled=false
ai-cover.ranking-mode=disabled
ai-cover.scene-brief-enabled=false
ai-cover.cover-mode=APPLICATION_SCENE
ai-cover.evidence-max-chars=16000
ai-cover.section-snippet-max-chars=2000
ai-cover.max-figure-captions=8
ai-cover.max-table-captions=4
ai.require-llm-understanding-for-cover=true
ai.require-llm-understanding-for-social-copy=true
ai.disable-weak-fallback-output=true
