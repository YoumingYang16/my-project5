spring.application.name=heritage-platform
security.jwt.secret=${JWT_SECRET:}
app.bootstrap-admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.nickname=${APP_ADMIN_NICKNAME:Platform administrator}

#spring.datasource.url=jdbc:h2:file:./data/heritage-platform;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=never
spring.sql.init.platform=mysql

#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

spring.profiles.active=mysql

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

app.upload-dir=uploads

openai.enabled=${OPENAI_ENABLED:true}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.5}
openai.paper-understanding-model=${OPENAI_PAPER_UNDERSTANDING_MODEL:gpt-5.4-mini}
openai.paper-understanding-reasoning-effort=${OPENAI_PAPER_UNDERSTANDING_REASONING_EFFORT:none}
openai.paper-understanding-max-output-tokens=${OPENAI_PAPER_UNDERSTANDING_MAX_OUTPUT_TOKENS:4000}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:300}
openai.connect-timeout-seconds=${OPENAI_CONNECT_TIMEOUT_SECONDS:20}
openai.read-timeout-seconds=${OPENAI_READ_TIMEOUT_SECONDS:${OPENAI_TIMEOUT_SECONDS:300}}
openai.paper-understanding-timeout-seconds=${OPENAI_PAPER_UNDERSTANDING_TIMEOUT_SECONDS:${OPENAI_TIMEOUT_SECONDS:300}}
openai.scene-brief-timeout-seconds=${OPENAI_SCENE_BRIEF_TIMEOUT_SECONDS:90}
openai.max-input-chars=${OPENAI_MAX_INPUT_CHARS:16000}

# Every publication copy is generated by DeepSeek. There is deliberately no
# OpenAI/template/evidence-fallback copy route: a DeepSeek failure is surfaced to the user.
ai.social-copy.provider=${AI_SOCIAL_COPY_PROVIDER:deepseek}
ai.social-copy.require-openai-for-polished=false
ai.social-copy.allow-evidence-fallback-when-openai-unavailable=false
ai.social-copy.provider-priority=deepseek
ai.social-copy.compact-llm-mode=${AI_SOCIAL_COPY_COMPACT_LLM_MODE:true}
ai.social-copy.max-retries=${AI_SOCIAL_COPY_MAX_RETRIES:1}
ai.social-copy.initial-backoff-seconds=${AI_SOCIAL_COPY_INITIAL_BACKOFF_SECONDS:5}
ai.social-copy.max-backoff-seconds=${AI_SOCIAL_COPY_MAX_BACKOFF_SECONDS:30}

deepseek.enabled=${DEEPSEEK_ENABLED:true}
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
deepseek.timeout-seconds=${DEEPSEEK_TIMEOUT_SECONDS:240}
deepseek.paper-understanding.max-content-chars=${DEEPSEEK_PAPER_UNDERSTANDING_MAX_CONTENT_CHARS:24000}
deepseek.connect-timeout-seconds=${DEEPSEEK_CONNECT_TIMEOUT_SECONDS:60}
deepseek.max-input-chars=${DEEPSEEK_MAX_INPUT_CHARS:16000}
deepseek.paper-understanding-client-max-input-chars=${DEEPSEEK_PAPER_UNDERSTANDING_CLIENT_MAX_INPUT_CHARS:52000}
deepseek.max-output-tokens=${DEEPSEEK_MAX_OUTPUT_TOKENS:2800}
deepseek.proxy-token-ttl-seconds=${DEEPSEEK_PROXY_TOKEN_TTL_SECONDS:900}
deepseek.use-system-proxy=${DEEPSEEK_USE_SYSTEM_PROXY:false}
deepseek.proxy-host=${DEEPSEEK_PROXY_HOST:}
deepseek.proxy-port=${DEEPSEEK_PROXY_PORT:0}

# PDF/GROBID extraction is deterministic.  Do not call an intermediate AI or n8n
# before generating the social copy; the extracted evidence is sent directly to DeepSeek.
ai-understanding.provider-priority=${AI_UNDERSTANDING_PROVIDER_PRIORITY:deepseek,n8n,evidence_fallback}
ollama.enabled=${OLLAMA_ENABLED:false}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:14b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:240}
ollama.temperature=${OLLAMA_TEMPERATURE:0.1}
ollama.num-ctx=${OLLAMA_NUM_CTX:8192}
ollama.max-input-chars=${OLLAMA_MAX_INPUT_CHARS:16000}
ollama.use-structured-output=${OLLAMA_USE_STRUCTURED_OUTPUT:true}

ai-cover.scene-brief-enabled=${AI_COVER_SCENE_BRIEF_ENABLED:false}
ai-cover.reference-grounding-enabled=${AI_COVER_REFERENCE_GROUNDING_ENABLED:true}
ai-cover.candidate-ranking-enabled=${AI_COVER_CANDIDATE_RANKING_ENABLED:false}
ai-cover.ranking-mode=${AI_COVER_RANKING_MODE:disabled}
ai-cover.show-ranking-details=${AI_COVER_SHOW_RANKING_DETAILS:false}
ai-cover.cover-mode=${AI_COVER_MODE:APPLICATION_SCENE}
ai-cover.evidence-max-chars=${OPENAI_MAX_INPUT_CHARS:${AI_COVER_EVIDENCE_MAX_CHARS:16000}}
ai-cover.section-snippet-max-chars=${AI_COVER_SECTION_SNIPPET_MAX_CHARS:2000}
ai-cover.max-figure-captions=${AI_COVER_MAX_FIGURE_CAPTIONS:8}
ai-cover.max-table-captions=${AI_COVER_MAX_TABLE_CAPTIONS:4}
ai-cover.pdf-text-max-pages=${AI_COVER_PDF_TEXT_MAX_PAGES:0}
ai-cover.pdf-text-max-chars=${AI_COVER_PDF_TEXT_MAX_CHARS:0}

# GROBID, complete native PDF text, DOI metadata, and stored publication metadata form one evidence packet.
# Retrieval selects grounded page-level evidence for DeepSeek instead of passing an entire PDF to one prompt.
# PDF upload and publication saving remain independent of AI generation.
grobid.enabled=${GROBID_ENABLED:true}
grobid.url=${GROBID_URL:http://localhost:8070}
grobid.base-url=${GROBID_URL:http://localhost:8070}
grobid.timeout-seconds=30
grobid.fail-upload-if-unavailable=false

# Optional Docling/OCR fallback. It is only called when neither native PDF text nor
# GROBID full text is usable. Start services/paper-parser separately when enabling it.
docling.enabled=${DOCLING_ENABLED:false}
docling.url=${DOCLING_URL:http://localhost:8091}
docling.timeout-seconds=${DOCLING_TIMEOUT_SECONDS:120}

comfyui.enabled=${COMFYUI_ENABLED:true}
comfyui.base-url=${COMFYUI_BASE_URL:http://127.0.0.1:8188}
comfyui.workflow=${COMFYUI_WORKFLOW:sdxl-basic-teaser-workflow.json}
comfyui.checkpoint=${COMFYUI_CHECKPOINT:sd_xl_base_1.0.safetensors}
comfyui.output-directory=${COMFYUI_OUTPUT_DIR:uploads/generated-covers}
comfyui.default-width=${COMFYUI_WIDTH:1024}
comfyui.default-height=${COMFYUI_HEIGHT:768}
comfyui.internal-candidates=${COMFYUI_INTERNAL_CANDIDATES:1}
comfyui.return-candidates=${COMFYUI_RETURN_CANDIDATES:52}
comfyui.timeout-seconds=${COMFYUI_TIMEOUT_SECONDS:180}

# Deprecated old figure teaser workflow. Kept disabled so normal publication
# upload/edit/display behavior remains unaffected while AI covers replace it.
pdffigures2.enabled=false
pdffigures2.required=false
pdffigures2.command=
pdffigures2.repo-dir=
pdffigures2.timeout-seconds=90
pdffigures2.output-dir=uploads/figures

# Optional Crossref DOI enrichment. Failures only reduce candidate quality; they
# never block upload, draft saving, post editing, or publishing.
crossref.enabled=${CROSSREF_ENABLED:true}
crossref.base-url=${CROSSREF_BASE_URL:https://api.crossref.org}
crossref.timeout-seconds=${CROSSREF_TIMEOUT_SECONDS:10}
crossref.mailto=${CROSSREF_MAILTO:}

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
# Renderer integration adds Qwen, ComfyUI/IP-Adapter, PDF source figures, and
# local quality checks without changing the social-copy pipeline or website UI.
ai-cover.image-provider=${AI_COVER_IMAGE_PROVIDER:renderer-api}
ai-cover.legacy-comfyui-fallback=${AI_COVER_LEGACY_COMFYUI_FALLBACK:true}
renderer-api.enabled=${RENDERER_API_ENABLED:true}
renderer-api.base-url=${RENDERER_API_BASE_URL:http://127.0.0.1:3001}
renderer-api.timeout-seconds=${RENDERER_API_TIMEOUT_SECONDS:600}
renderer-api.image-provider-mode=${RENDERER_API_IMAGE_PROVIDER_MODE:dual}
renderer-api.source-policy=${RENDERER_API_SOURCE_POLICY:balanced}
renderer-api.aesthetic-profile=${RENDERER_API_AESTHETIC_PROFILE:editorial}
renderer-api.quality-mode=${RENDERER_API_QUALITY_MODE:strict}
ai-cover.cached-images-short-circuit=${AI_COVER_CACHED_IMAGES_SHORT_CIRCUIT:false}

n8n.paper-understanding.enabled=${N8N_PAPER_UNDERSTANDING_ENABLED:true}
n8n.paper-understanding.url=${N8N_PAPER_UNDERSTANDING_URL:http://127.0.0.1:5679/webhook/website-single-paper-brief}
n8n.paper-understanding.timeout-seconds=${N8N_PAPER_UNDERSTANDING_TIMEOUT_SECONDS:90}
n8n.paper-understanding.connect-timeout-seconds=${N8N_PAPER_UNDERSTANDING_CONNECT_TIMEOUT_SECONDS:10}
n8n.paper-understanding.max-content-chars=${N8N_PAPER_UNDERSTANDING_MAX_CONTENT_CHARS:80000}
n8n.paper-understanding.token=${N8N_PAPER_UNDERSTANDING_TOKEN:}
